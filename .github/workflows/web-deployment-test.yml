name: Web deployment tests

on:
  pull_request:
    paths:
      - 'scripts/deploy-web*'
      - 'scripts/upload-web-assets*'
      - 'scripts/cleanup-web-assets*'
      - 'scripts/verify-web-release*'
      - 'scripts/desktop-skin-assets.json'
      - 'scripts/import-dreamskin-themes.mjs'
      - 'scripts/dreamskin-import-core*'
      - 'scripts/dreamskin-sources.json'
      - 'packages/happy-app/public/desktop-skins/**'
      - 'scripts/oss-upload-sync.cjs'
      - 'scripts/test-helpers/fake-aliyun.cjs'
      - 'scripts/deploy-agent-party*'
      - 'scripts/configure-production-agent-party-caddy*'
      - 'scripts/deploy-staging-web*'
      - 'scripts/prune-staging-web-releases.sh'
      - 'scripts/configure-staging-web-caddy*'
      - 'scripts/web-release-source.sh'
      - 'scripts/web-production-deploy.test.mjs'
      - '.github/workflows/web-production-deploy.yml'
      - '.github/workflows/web-retention.yml'
      - '.github/workflows/agent-party-production-deploy.yml'
      - '.github/workflows/web-deployment-test.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-web*'
      - 'scripts/upload-web-assets*'
      - 'scripts/cleanup-web-assets*'
      - 'scripts/verify-web-release*'
      - 'scripts/desktop-skin-assets.json'
      - 'scripts/import-dreamskin-themes.mjs'
      - 'scripts/dreamskin-import-core*'
      - 'scripts/dreamskin-sources.json'
      - 'packages/happy-app/public/desktop-skins/**'
      - 'scripts/oss-upload-sync.cjs'
      - 'scripts/test-helpers/fake-aliyun.cjs'
      - 'scripts/deploy-agent-party*'
      - 'scripts/configure-production-agent-party-caddy*'
      - 'scripts/deploy-staging-web*'
      - 'scripts/prune-staging-web-releases.sh'
      - 'scripts/configure-staging-web-caddy*'
      - 'scripts/web-release-source.sh'
      - 'scripts/web-production-deploy.test.mjs'
      - '.github/workflows/web-production-deploy.yml'
      - '.github/workflows/web-retention.yml'
      - '.github/workflows/agent-party-production-deploy.yml'
      - '.github/workflows/web-deployment-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter monorepo
      - name: Verify deployment and supersession guards
        run: node --test scripts/cleanup-web-assets.test.mjs scripts/dreamskin-import-core.test.mjs scripts/deploy-web.test.mjs scripts/web-production-deploy.test.mjs scripts/upload-web-assets.test.mjs scripts/verify-web-release.test.mjs scripts/deploy-agent-party.test.mjs scripts/configure-production-agent-party-caddy.test.mjs scripts/deploy-staging-web.test.mjs scripts/configure-staging-web-caddy.test.mjs scripts/configure-staging-web-caddy.integration.test.mjs
