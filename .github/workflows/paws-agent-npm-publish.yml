name: Paws Agent npm publish
run-name: "Paws Agent ${{ inputs.ego_verified_sha256 && 'publish' || 'prepare (not published)' }} · ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: ['paws-agent-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable paws-agent-v* tag to publish
        required: true
        type: string
      ego_verified_sha256:
        description: SHA-256 of this exact tarball after local Ego browser acceptance; empty only prepares an artifact
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: paws-agent-npm-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Validate immutable release contract
        id: contract
        shell: bash
        env:
          PAWS_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          PAWS_TAG_SHA="$(git rev-parse --verify "refs/tags/$PAWS_RELEASE_TAG^{commit}")"
          test -n "$PAWS_TAG_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$PAWS_TAG_SHA" origin/main
          PAWS_TAG_SHA="$PAWS_TAG_SHA" GITHUB_SHA="$(git rev-parse HEAD)" node packages/paws-agent/scripts/release-contract.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wangjs-jacky/paws-agent test
      - run: pnpm --filter @wangjs-jacky/paws-agent test:integration
      - name: Pack once
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/paws-agent"
          cd packages/paws-agent
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/paws-agent"
          TARBALL="$(find "$RUNNER_TEMP/paws-agent" -name '*.tgz' -print -quit)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          shasum -a 256 "$TARBALL" | tee "$RUNNER_TEMP/paws-agent/SHA256SUMS"
          echo "sha256=$(shasum -a 256 "$TARBALL" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Require the exact Ego-verified digest before publication
        if: inputs.ego_verified_sha256 != ''
        env:
          VERIFIED_SHA256: ${{ inputs.ego_verified_sha256 }}
          ACTUAL_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          node --input-type=module -e "import { assertEgoVerifiedDigest } from './packages/paws-agent/scripts/release-contract.mjs'; assertEgoVerifiedDigest(process.env.VERIFIED_SHA256, process.env.ACTUAL_SHA256)"
      - name: Load verifier from the workflow revision after packing
        env:
          AUTOMATION_SHA: ${{ github.sha }}
        run: |
          # Keep the tagged package immutable while allowing release-tool repairs.
          git show "$AUTOMATION_SHA:packages/paws-agent/scripts/verify-pack.mjs" > packages/paws-agent/scripts/verify-pack.mjs
      - name: Verify the exact release tarball
        shell: bash
        run: PAWS_AGENT_DIST_TAG="${{ steps.contract.outputs.dist_tag }}" node packages/paws-agent/scripts/verify-pack.mjs --prepare-browser "${{ steps.pack.outputs.tarball }}" | tee "$RUNNER_TEMP/paws-agent/node-consumer-verification.json"
      - name: Check exact registry version
        id: registry
        if: inputs.ego_verified_sha256 != ''
        shell: bash
        run: |
          if npm view "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}" version >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Record previous stable dist-tag
        id: previous
        if: inputs.ego_verified_sha256 != ''
        shell: bash
        run: echo "latest=$(npm view '@wangjs-jacky/paws-agent' dist-tags.latest 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Verify an existing version is the exact local tarball
        if: steps.registry.outputs.exists == 'true'
        shell: bash
        run: node packages/paws-agent/scripts/verify-registry-integrity.mjs "${{ steps.pack.outputs.tarball }}" "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}"
      - name: Publish with NPM_TOKEN or npm trusted publishing
        id: publish
        if: inputs.ego_verified_sha256 != '' && steps.registry.outputs.exists == 'false'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo 'Using repository NPM_TOKEN for npm publication.'
            npm whoami --registry https://registry.npmjs.org
          else
            echo 'NPM_TOKEN absent; npm trusted publishing must already be configured.'
          fi
          set +e
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --tag "${{ steps.contract.outputs.dist_tag }}"
          publish_status=$?
          set -e
          if [ "$publish_status" -ne 0 ]; then
            published_version="$(npm view "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}" version 2>/dev/null || true)"
            if [ "$published_version" != "${{ steps.contract.outputs.version }}" ]; then
              exit "$publish_status"
            fi
            echo "Publish returned $publish_status, but the immutable version is present; continuing verification."
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"
      - name: Verify exact registry artifact, consumers, and isolated E2E
        id: post_publish
        if: inputs.ego_verified_sha256 != ''
        continue-on-error: true
        shell: bash
        env:
          PAWS_AGENT_INSTALL_SPEC: '@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}'
          PAWS_AGENT_DIST_TAG: '${{ steps.contract.outputs.dist_tag }}'
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            published_version="$(npm view "@wangjs-jacky/paws-agent@${{ steps.contract.outputs.version }}" version 2>/dev/null || true)"
            if [ "$published_version" = "${{ steps.contract.outputs.version }}" ]; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Exact npm version did not become visible within five minutes" >&2
              exit 1
            fi
            sleep 10
          done
          node packages/paws-agent/scripts/verify-registry-integrity.mjs "${{ steps.pack.outputs.tarball }}" "$PAWS_AGENT_INSTALL_SPEC"
          node packages/paws-agent/scripts/verify-pack.mjs --prepare-browser "${{ steps.pack.outputs.tarball }}"
          pnpm --filter @wangjs-jacky/paws-agent test
          registry_e2e="$RUNNER_TEMP/paws-agent-registry-e2e"
          mkdir -p "$registry_e2e"
          (cd "$registry_e2e" && npm init -y)
          npm install --prefix "$registry_e2e" --ignore-scripts "$PAWS_AGENT_INSTALL_SPEC"
          PAWS_AGENT_CONSUMER_DIR="$registry_e2e" PAWS_AGENT_BIN_PATH="$registry_e2e/node_modules/.bin/paws-agent" pnpm --filter @wangjs-jacky/paws-agent test:integration
      - name: Promote the verified version and clear this workflow's rollback marker
        if: inputs.ego_verified_sha256 != '' && steps.post_publish.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_VERSION: ${{ steps.contract.outputs.version }}
          RELEASE_DIST_TAG: ${{ steps.contract.outputs.dist_tag }}
        run: |
          set -euo pipefail
          release_spec="@wangjs-jacky/paws-agent@$RELEASE_VERSION"
          deprecated="$(npm view "$release_spec" deprecated)"
          if [ "$deprecated" = 'Post-publish validation failed; use the previous latest release.' ]; then
            npm deprecate "$release_spec" ""
          elif [ -n "$deprecated" ]; then
            echo 'Refusing to clear a deprecation not created by this workflow.' >&2
            exit 1
          fi
          current="$(npm view '@wangjs-jacky/paws-agent' "dist-tags.$RELEASE_DIST_TAG")"
          if [ "$current" != "$RELEASE_VERSION" ]; then
            npm dist-tag add "$release_spec" "$RELEASE_DIST_TAG"
          fi
          test "$(npm view '@wangjs-jacky/paws-agent' "dist-tags.$RELEASE_DIST_TAG")" = "$RELEASE_VERSION"
          test -z "$(npm view "$release_spec" deprecated)"
      - name: Roll back a failed stable promotion when credentials permit
        if: >-
          steps.post_publish.outcome == 'failure' &&
          steps.publish.outputs.published == 'true' &&
          steps.contract.outputs.dist_tag == 'latest'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PREVIOUS_LATEST: ${{ steps.previous.outputs.latest }}
          FAILED_VERSION: ${{ steps.contract.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo 'NPM_TOKEN is unavailable; automatic dist-tag rollback/deprecation could not run.' >&2
            exit 1
          fi
          if [ -n "$PREVIOUS_LATEST" ] && [ "$PREVIOUS_LATEST" != "$FAILED_VERSION" ]; then
            npm dist-tag add "@wangjs-jacky/paws-agent@$PREVIOUS_LATEST" latest
          elif [ -z "$PREVIOUS_LATEST" ]; then
            npm dist-tag rm '@wangjs-jacky/paws-agent' latest
          fi
          npm deprecate "@wangjs-jacky/paws-agent@$FAILED_VERSION" "Post-publish validation failed; use the previous latest release."
      - name: Fail release after post-publish validation
        if: always() && steps.post_publish.outcome == 'failure'
        run: exit 1
      # GitHub Releases is reserved for Android APKs. npm + the immutable tag
      # remain the permanent CLI distribution/source record; CI evidence expires.
      - name: Preserve npm release evidence (90 days)
        if: always() && steps.pack.outputs.tarball != ''
        uses: actions/upload-artifact@v4
        with:
          name: paws-agent-npm-evidence-${{ inputs.tag || github.ref_name }}
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/paws-agent/SHA256SUMS
            ${{ runner.temp }}/paws-agent/node-consumer-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Explain preparation versus publication
        if: success()
        env:
          VERIFIED_SHA256: ${{ inputs.ego_verified_sha256 }}
          ACTUAL_SHA256: ${{ steps.pack.outputs.sha256 }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "$VERIFIED_SHA256" ]; then
            echo '### Prepared only — NOT published to npm' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download this run artifact, run verify-pack.mjs --prepare-browser on the tarball, and verify the emitted browserFixture in Ego. Then dispatch this workflow with the same tag and the verified SHA-256.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Exact Ego-verified tarball published/verified on npm' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Tag: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: $ACTUAL_SHA256" >> "$GITHUB_STEP_SUMMARY"
