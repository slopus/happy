name: CLI npm publish

on:
  pull_request:
    paths:
      - 'scripts/verify-npm-publication.mjs'
      - 'scripts/verify-npm-publication.test.mjs'
      - '.github/workflows/cli-npm-publish.yml'
  push:
    branches: [main]
    paths:
      - 'packages/happy-cli/**'
      - 'packages/happy-wire/**'
      - 'scripts/verify-npm-publication.mjs'
      - 'scripts/verify-npm-publication.test.mjs'
      - '.github/workflows/cli-npm-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verification-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test npm publication verification
        run: node --test scripts/verify-npm-publication.test.mjs

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check npm CLI
        shell: bash
        run: |
          set -euo pipefail
          npm --version
          node --version

      - name: Test npm publication verification
        run: node --test scripts/verify-npm-publication.test.mjs

      - name: Read package version
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./packages/happy-cli/package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing candidate: @wangjs-jacky/paws@${VERSION}"

      - name: Check npm version
        id: npm
        shell: bash
        run: |
          set -euo pipefail
          if npm view "@wangjs-jacky/paws@${{ steps.pkg.outputs.version }}" version --json >/tmp/paws-version.json 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@wangjs-jacky/paws@${{ steps.pkg.outputs.version }} already exists on npm."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "@wangjs-jacky/paws@${{ steps.pkg.outputs.version }} is not on npm yet."
          fi

      - name: Test package
        if: steps.npm.outputs.exists == 'false'
        run: pnpm --filter @wangjs-jacky/paws test

      - name: Pack package
        if: steps.npm.outputs.exists == 'false'
        id: pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/paws-publish
          pnpm --filter @wangjs-jacky/paws pack --pack-destination /tmp/paws-publish
          TARBALL="$(find /tmp/paws-publish -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "${TARBALL}" ]; then
            echo "::error::Package tarball was not generated."
            exit 1
          fi
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Smoke test packed package
        if: steps.npm.outputs.exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          SMOKE_DIR="$(mktemp -d)"
          npm install --prefix "$SMOKE_DIR" --ignore-scripts "${{ steps.pack.outputs.tarball }}"
          VERSION_OUTPUT="$("$SMOKE_DIR/node_modules/.bin/paws" --version 2>&1)"
          EXPECTED_VERSION="happy version: ${{ steps.pkg.outputs.version }}"
          printf '%s\n' "$VERSION_OUTPUT"
          if [ "$VERSION_OUTPUT" != "$EXPECTED_VERSION" ]; then
            echo "::error::Installed paws reported '$VERSION_OUTPUT'; expected '$EXPECTED_VERSION'."
            exit 1
          fi
          echo "Verified installed paws reports '$EXPECTED_VERSION'."

      - name: Publish package
        if: steps.npm.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
            echo "Publishing with NPM_TOKEN."
          else
            echo "Publishing with npm trusted publishing (GitHub OIDC)."
          fi
          npm publish "${{ steps.pack.outputs.tarball }}" --access public

      - name: Verify published package
        env:
          NPM_VERIFY_TIMEOUT_MS: '900000'
          NPM_VERIFY_INTERVAL_MS: '10000'
        run: |
          node scripts/verify-npm-publication.mjs \
            '@wangjs-jacky/paws' \
            '${{ steps.pkg.outputs.version }}' \
            latest

      - name: Report skipped publish
        if: steps.npm.outputs.exists == 'true'
        run: echo "Skipped publish because @wangjs-jacky/paws@${{ steps.pkg.outputs.version }} already exists on npm."
