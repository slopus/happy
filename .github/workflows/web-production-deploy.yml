name: Deploy Paws Web to production (on merge to main)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: paws-web-production
  # A deployment may be between the OSS marker and HTML switches. Queue newer
  # main revisions instead of cancelling the active release before rollback can run.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-web
    env:
      PAWS_WEB_ORIGIN: https://47.115.228.20:8443
      PAWS_LEGACY_WEB_ORIGIN: http://47.115.228.20:8080
      PAWS_DEPLOY_HOST: root@47.115.228.20
      PAWS_DEPLOY_PORT: '22'
      PAWS_LEGACY_WEB_PATH: /var/www/happy-web
      PAWS_WEB_OSS_BUCKET: happy-app-ota-jacky
      PAWS_WEB_OSS_ORIGIN: https://happy-app-ota-jacky.oss-cn-hangzhou.aliyuncs.com
      OSS_UPLOAD_ENDPOINT: https://oss-cn-hangzhou.aliyuncs.com
      OSS_ADDRESSING_STYLE: virtual
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIBABA_CLOUD_REGION_ID: cn-hangzhou
    steps:
      - name: Checkout merged main revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore main branch for release guard
        run: git checkout -B main "$GITHUB_SHA"

      - name: Guard deployment configuration
        run: |
          set -euo pipefail
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_ID" || { echo '::error::Missing ALIYUN_OSS_ACCESS_KEY_ID secret.'; exit 1; }
          test -n "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" || { echo '::error::Missing ALIYUN_OSS_ACCESS_KEY_SECRET secret.'; exit 1; }
          test -n "${{ secrets.PAWS_WEB_DEPLOY_SSH_PRIVATE_KEY }}" || { echo '::error::Missing PAWS_WEB_DEPLOY_SSH_PRIVATE_KEY secret.'; exit 1; }
          test "$PAWS_WEB_ORIGIN" = 'https://47.115.228.20:8443'
          test "$PAWS_LEGACY_WEB_ORIGIN" = 'http://47.115.228.20:8080'
          test "$PAWS_WEB_OSS_ORIGIN" = 'https://happy-app-ota-jacky.oss-cn-hangzhou.aliyuncs.com'
          test "$PAWS_LEGACY_WEB_PATH" = '/var/www/happy-web'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Aliyun CLI
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/aliyun-cli.tgz https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzf /tmp/aliyun-cli.tgz -C /tmp
          sudo mv /tmp/aliyun /usr/local/bin/aliyun
          aliyun ossutil --help >/dev/null
          aliyun configure set --profile default --mode AK \
            --access-key-id "$ALIBABA_CLOUD_ACCESS_KEY_ID" \
            --access-key-secret "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" \
            --region cn-hangzhou

      - name: Configure verified SSH access
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.PAWS_WEB_DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_paws_web_deploy
          chmod 600 ~/.ssh/id_paws_web_deploy
          cat >> ~/.ssh/config <<EOF
          Host 47.115.228.20
            IdentityFile ~/.ssh/id_paws_web_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          cat >> ~/.ssh/known_hosts <<'EOF'
          47.115.228.20 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVfo18lZ0KyBKfSB3phd1CnYAQSH7DAYwVJ49HQOwM+
          47.115.228.20 ssh-rsa 
          47.115.228.20 ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBEmQUBstAnrOJApt7mRCo0vqiQKe9AG6IgWcwZ+X/RxBwVNPQnCPWjfR3GnxeZOsB5D/6XLIKQAyj/0/N79BlEU=
          EOF

      - name: Build and stamp Web from this main revision
        run: |
          set -euo pipefail
          RELEASE_TIMESTAMP="$(git show -s --format=%cI "$GITHUB_SHA")"
          CI=1 APP_ENV=production EXPO_PUBLIC_HAPPY_SERVER_URL="$PAWS_WEB_ORIGIN" \
            HAPPY_BUILD_COMMIT_SHA="$GITHUB_SHA" \
            HAPPY_BUILD_COMMIT_TIMESTAMP="$RELEASE_TIMESTAMP" \
            pnpm --filter happy-app exec expo export --platform web --clear
          pnpm --filter happy-app exec tsx sources/scripts/injectWebLoading.ts
          node scripts/stamp-web-release.mjs \
            packages/happy-app/dist/index.html \
            packages/happy-app/dist/.paws-release-revision \
            "$GITHUB_SHA"

      - name: Upload complete immutable Web release
        run: bash scripts/upload-web-assets.sh

      - name: Verify immutable OSS release before activation
        run: node scripts/verify-web-release.mjs "$PAWS_WEB_OSS_ORIGIN" packages/happy-app/dist/index.html --immutable "$PAWS_WEB_ORIGIN"

      - name: Atomically switch OSS Web entry
        id: switch
        env:
          PAWS_SKIP_BUILD: '1'
          PAWS_WEB_RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
        run: pnpm web:deploy

      - name: Route the Web SPA to OSS
        id: caddy
        run: |
          set -euo pipefail
          current_caddy="$(mktemp)"
          next_caddy="$(mktemp)"
          remote_candidate="/tmp/paws-caddy-$GITHUB_SHA"
          remote_backup="/etc/caddy/Caddyfile.paws-web-oss.previous-$GITHUB_SHA"
          trap 'rm -f "$current_caddy" "$next_caddy"' EXIT
          ssh -p "$PAWS_DEPLOY_PORT" "$PAWS_DEPLOY_HOST" 'cat /etc/caddy/Caddyfile' > "$current_caddy"
          caddy_change="$(node scripts/configure-production-web-caddy.mjs "$current_caddy" "$next_caddy")"
          if [ "$caddy_change" = 'unchanged' ]; then
            echo 'backup_path=' >> "$GITHUB_OUTPUT"
            echo 'Caddyfile already routes the Web SPA to OSS.'
            exit 0
          fi
          test "$caddy_change" = 'changed'
          scp -P "$PAWS_DEPLOY_PORT" "$next_caddy" "$PAWS_DEPLOY_HOST:$remote_candidate"
          echo "backup_path=$remote_backup" >> "$GITHUB_OUTPUT"
          ssh -p "$PAWS_DEPLOY_PORT" "$PAWS_DEPLOY_HOST" bash -s -- "$remote_candidate" "$remote_backup" "$PAWS_LEGACY_WEB_PATH" <<'REMOTE_SCRIPT'
          set -euo pipefail
          candidate="$1"
          backup="$2"
          legacy_path="$3"
          config="/etc/caddy/Caddyfile"
          test "$legacy_path" = '/var/www/happy-web'
          cleanup() { rm -f -- "$candidate"; }
          trap cleanup EXIT
          cp -p -- "$config" "$backup"
          install -m 644 -- "$candidate" "$config"
          if ! caddy validate --config "$config"; then
            cp -p -- "$backup" "$config"
            exit 1
          fi
          if ! adapted_config="$(caddy adapt --config "$config" --adapter caddyfile)"; then
            cp -p -- "$backup" "$config"
            exit 1
          fi
          if grep -Fq -- "$legacy_path" <<<"$adapted_config"; then
            echo "错误：expanded Caddy config 仍引用 $legacy_path，拒绝激活。" >&2
            cp -p -- "$backup" "$config"
            exit 1
          fi
          if ! systemctl --no-block reload caddy; then
            cp -p -- "$backup" "$config"
            caddy validate --config "$config"
            systemctl --no-block reload caddy
            exit 1
          fi
          REMOTE_SCRIPT

      - name: Verify live OSS-backed release and routes
        id: live_verify
        run: node scripts/verify-web-release.mjs "$PAWS_WEB_ORIGIN" packages/happy-app/dist/index.html

      - name: Remove guarded legacy Web files
        id: cleanup
        run: |
          set -euo pipefail
          legacy_path="$PAWS_LEGACY_WEB_PATH"
          test "$legacy_path" = '/var/www/happy-web'
          ssh -p "$PAWS_DEPLOY_PORT" "$PAWS_DEPLOY_HOST" bash -s -- "$legacy_path" <<'REMOTE_SCRIPT'
          set -euo pipefail
          legacy_path="$1"
          test "$legacy_path" = '/var/www/happy-web'
          if ! adapted_config="$(caddy adapt --config /etc/caddy/Caddyfile --adapter caddyfile)"; then
            echo '错误：无法展开 active Caddy config，拒绝删除 legacy Web files。' >&2
            exit 1
          fi
          if grep -Fq -- "$legacy_path" <<<"$adapted_config"; then
            echo "错误：expanded active Caddy config 仍引用 $legacy_path，拒绝删除。" >&2
            exit 1
          fi
          for target in "$legacy_path" "${legacy_path}.backup-"* "${legacy_path}.next-"*; do
            [[ -e "$target" ]] || continue
            case "$target" in
              /var/www/happy-web|/var/www/happy-web.backup-*|/var/www/happy-web.next-*)
                rm -rf -- "$target"
                ;;
              *)
                echo "错误：legacy cleanup target 越界：$target" >&2
                exit 1
                ;;
            esac
          done
          REMOTE_SCRIPT

      - name: Roll back failed Web activation
        if: ${{ failure() && steps.live_verify.outcome != 'success' }}
        run: |
          set -uo pipefail
          rollback_prefix="${{ steps.switch.outputs.rollback_prefix }}"
          caddy_backup="${{ steps.caddy.outputs.backup_path }}"
          oss_rollback_status=0
          caddy_rollback_status=0
          set +e
          if [ -n "$rollback_prefix" ]; then
            bash scripts/deploy-web.sh --rollback "$rollback_prefix"
            oss_rollback_status=$?
          fi
          if [ -n "$caddy_backup" ]; then
            ssh -p "$PAWS_DEPLOY_PORT" "$PAWS_DEPLOY_HOST" bash -s -- "$caddy_backup" <<'REMOTE_SCRIPT'
          set -euo pipefail
          backup="$1"
          config="/etc/caddy/Caddyfile"
          case "$backup" in
            /etc/caddy/Caddyfile.paws-web-oss.previous-*) ;;
            *) echo "错误：Caddy rollback path 越界。" >&2; exit 1 ;;
          esac
          test -f "$backup"
          cp -p -- "$backup" "$config"
          caddy validate --config "$config"
          systemctl --no-block reload caddy
          reload_completed=0
          for ((attempt=1; attempt<=30; attempt+=1)); do
            pending_jobs="$(systemctl list-jobs --no-legend --plain caddy.service 2>/dev/null || true)"
            active_state="$(systemctl show caddy --property=ActiveState --value)"
            reload_result="$(systemctl show caddy --property=ReloadResult --value 2>/dev/null || true)"
            if [ -z "$pending_jobs" ]; then
              if [ "$active_state" = 'active' ] && { [ -z "$reload_result" ] || [ "$reload_result" = 'success' ]; }; then
                reload_completed=1
                break
              fi
              echo "错误：Caddy rollback reload 失败（state=$active_state, result=${reload_result:-unknown}）。" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$reload_completed" -ne 1 ]; then
            echo '错误：Caddy rollback reload 未在 30 秒内完成。' >&2
            exit 1
          fi
          REMOTE_SCRIPT
            caddy_rollback_status=$?
            if [ "$caddy_rollback_status" -eq 0 ]; then
              node scripts/verify-web-rollback.mjs "$PAWS_WEB_ORIGIN"
              caddy_rollback_status=$?
            fi
          fi
          set -e
          if [ "$oss_rollback_status" -ne 0 ] || [ "$caddy_rollback_status" -ne 0 ]; then
            echo "错误：Web 回滚未完全成功（OSS=$oss_rollback_status, Caddy=$caddy_rollback_status）。" >&2
            exit 1
          fi

      - name: Write deployment summary
        if: success()
        run: |
          {
            echo '### Paws Web deployed'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| Origin | $PAWS_WEB_ORIGIN |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Static storage | \`oss://$PAWS_WEB_OSS_BUCKET/web/releases/$GITHUB_SHA/\` |"
            echo '| Server Web files | Removed after verification |'
          } >> "$GITHUB_STEP_SUMMARY"
