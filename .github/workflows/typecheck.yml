name: Expo App TypeScript typecheck

on:
    pull_request:
        paths:
            - 'packages/happy-app/**'
            - 'patches/fix-expo-camera-scanner-transitions.cjs'
            - 'scripts/postinstall.cjs'
            - '.github/workflows/typecheck.yml'
    push:
        branches:
            - main
        paths:
            - 'packages/happy-app/**'
            - 'patches/fix-expo-camera-scanner-transitions.cjs'
            - 'scripts/postinstall.cjs'
            - '.github/workflows/typecheck.yml'

jobs:
    typecheck:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: TypeScript typecheck
              run: pnpm --filter happy-app typecheck

            - name: Verify Expo Camera scanner transition patch
              run: pnpm test:expo-camera-patch

            - name: Verify Android build variant contract
              run: pnpm --filter happy-app exec vitest run sources/utils/otaRuntimeConfig.test.ts
