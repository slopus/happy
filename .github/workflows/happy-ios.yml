name: happy-ios

on:
  pull_request:
    paths: ['packages/happy-ios/**', 'packages/happy-i18n/**', '.github/workflows/happy-ios.yml']
  push:
    branches: [main]
    paths: ['packages/happy-ios/**', 'packages/happy-i18n/**', '.github/workflows/happy-ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: happy-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uikit:
    # Xcode 27.2, what the app is built and released with; the tests'
    # layout expectations are iOS 27's. The `xcode-27` image is a GitHub
    # preview (runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      # The hosted runners' simulators run about twice as slow as a Mac's:
      # the tests' time budgets stretch by this (`TestTime`), and what
      # each frame shows is checked as on a Mac.
      TEST_RUNNER_HAPPY_TEST_TIME_SCALE: '2.5'
    defaults:
      run:
        working-directory: packages/happy-ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Xcode and generate the project
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project.yml
          mkdir -p build/ci
      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build/ci/simulators.json
          python3 scripts/ci-simulator.py build/ci/simulators.json >> "$GITHUB_ENV"
      - name: Run UIKit tests on the simulator
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$HAPPY_IOS_SIMULATOR_ID" -b
          xcodebuild test \
            -project Happy.xcodeproj \
            -scheme Happy \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HAPPY_IOS_SIMULATOR_ID" \
            -destination-timeout 120 \
            -derivedDataPath build/ci/DerivedData \
            -resultBundlePath build/ci/HappyUIKitTests.xcresult \
            -parallel-testing-enabled NO \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/ci/xcodebuild.log
      - name: Export readable test results and diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d build/ci/HappyUIKitTests.xcresult ]]; then
            exit 0
          fi
          export_json() {
            local kind="$1" output="$2"
            if xcrun xcresulttool get test-results "$kind" --help >> build/ci/diagnostics-export.log 2>&1 \
              && xcrun xcresulttool get test-results "$kind" \
                --path build/ci/HappyUIKitTests.xcresult > "$output.tmp" 2>> build/ci/diagnostics-export.log \
              && mv "$output.tmp" "$output"; then
              :
            else
              echo "::warning::Could not export native test $kind; see diagnostics-export.log"
            fi
          }
          export_json summary build/ci/test-summary.json
          export_json tests build/ci/test-results.json
          if xcrun xcresulttool export diagnostics --help >> build/ci/diagnostics-export.log 2>&1 \
            && xcrun xcresulttool export diagnostics \
              --path build/ci/HappyUIKitTests.xcresult \
              --output-path build/ci/diagnostics >> build/ci/diagnostics-export.log 2>&1; then
            :
          else
            echo "::warning::Could not export native test diagnostics; see diagnostics-export.log"
          fi
      - name: Upload test results and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ios-uikit-${{ github.sha }}
          path: |
            packages/happy-ios/build/ci/HappyUIKitTests.xcresult
            packages/happy-ios/build/ci/xcodebuild.log
            packages/happy-ios/build/ci/simulators.json
            packages/happy-ios/build/ci/test-summary.json
            packages/happy-ios/build/ci/test-results.json
            packages/happy-ios/build/ci/diagnostics
            packages/happy-ios/build/ci/diagnostics-export.log
          if-no-files-found: warn
          retention-days: 7
  hosted:
    # The hosted UIKit tests, in shards so each runs to its end; each
    # shard builds the host itself. `scripts/hosted-test-shard.py` says
    # which classes are whose.
    runs-on: xcode-27
    timeout-minutes: 60
    # Reports without blocking: on the hosted VMs a different handful of
    # frame-timing tests fails each run, however their budgets stretch,
    # while they pass on a Mac. `uikit` is the required check.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SHARDS: 3
      # The hosted runners' simulators run about twice as slow as a Mac's:
      # the tests' time budgets stretch by this (`TestTime`), and what
      # each frame shows is checked as on a Mac.
      TEST_RUNNER_HAPPY_TEST_TIME_SCALE: '2.5'
    defaults:
      run:
        working-directory: packages/happy-ios
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Xcode and generate the project
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          brew install xcodegen
          xcodegen generate --spec project.yml
          mkdir -p build/ci
      - name: Select an available iPhone simulator
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > build/ci/simulators.json
          python3 scripts/ci-simulator.py build/ci/simulators.json >> "$GITHUB_ENV"
      - name: Build hosted UIKit tests and verify host isolation
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Happy.xcodeproj \
            -scheme HappyUIKitHosted \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HAPPY_IOS_SIMULATOR_ID" \
            -destination-timeout 120 \
            -derivedDataPath build/ci/DerivedData \
            -parallel-testing-enabled NO \
            -jobs 4 \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/ci/hosted-build.log
          python3 - <<'PY' | tee build/ci/hosted-link-check.log
          from pathlib import Path
          import re
          import subprocess

          products = Path('build/ci/DerivedData/Build/Products/Debug-iphonesimulator')
          host_app = products / 'HappyUIKitTestHost.app'
          host = host_app / 'HappyUIKitTestHost'
          bundle = host_app / 'PlugIns/HappyUIKitHostedTests.xctest/HappyUIKitHostedTests'
          if not bundle.is_file():
              bundle = products / 'HappyUIKitHostedTests.xctest/HappyUIKitHostedTests'
          pattern = r'ScreensLanguage|AppLocalization|TranslationCatalog|AgentInputCardView'
          def count(binary):
              symbols = subprocess.check_output(['nm', '-U', str(binary)], text=True)
              return sum(bool(re.search(pattern, line)) for line in symbols.splitlines())
          dylibs = list(host_app.glob('*.debug.dylib'))
          host_count = count(host)
          bundle_count = count(bundle)
          print(f'HOST_LINK host_symbols={host_count} bundle_symbols={bundle_count} debug_dylibs={len(dylibs)}')
          if dylibs or host_count != 0 or bundle_count == 0:
              raise SystemExit('Hosted UIKit app isolation check failed')
          PY
      - name: Run this shard's hosted UIKit tests on the simulator
        run: |
          set -euo pipefail
          python3 scripts/hosted-test-shard.py "${{ matrix.shard }}" "$SHARDS" > build/ci/hosted-shard.txt
          echo "Shard ${{ matrix.shard }} of $SHARDS: $(wc -l < build/ci/hosted-shard.txt) classes"
          xcrun simctl bootstatus "$HAPPY_IOS_SIMULATOR_ID" -b
          xargs xcodebuild test-without-building \
            -project Happy.xcodeproj \
            -scheme HappyUIKitHosted \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$HAPPY_IOS_SIMULATOR_ID" \
            -destination-timeout 120 \
            -derivedDataPath build/ci/DerivedData \
            -resultBundlePath build/ci/HappyUIKitHostedTests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            < build/ci/hosted-shard.txt \
            | tee build/ci/hosted-xcodebuild.log
      - name: Export hosted test results and diagnostics
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -d build/ci/HappyUIKitHostedTests.xcresult ]]; then
            exit 0
          fi
          export_hosted_json() {
            local kind="$1" output="$2"
            if xcrun xcresulttool get test-results "$kind" --help >> build/ci/hosted-diagnostics-export.log 2>&1 \
              && xcrun xcresulttool get test-results "$kind" \
                --path build/ci/HappyUIKitHostedTests.xcresult > "$output.tmp" 2>> build/ci/hosted-diagnostics-export.log \
              && mv "$output.tmp" "$output"; then
              :
            else
              echo "::warning::Could not export hosted test $kind; see hosted-diagnostics-export.log"
            fi
          }
          export_hosted_json summary build/ci/hosted-test-summary.json
          export_hosted_json tests build/ci/hosted-test-results.json
          if xcrun xcresulttool export diagnostics --help >> build/ci/hosted-diagnostics-export.log 2>&1 \
            && xcrun xcresulttool export diagnostics \
              --path build/ci/HappyUIKitHostedTests.xcresult \
              --output-path build/ci/hosted-diagnostics >> build/ci/hosted-diagnostics-export.log 2>&1; then
            :
          else
            echo "::warning::Could not export hosted test diagnostics; see hosted-diagnostics-export.log"
          fi
      - name: Upload hosted test results and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: happy-ios-hosted-${{ matrix.shard }}-${{ github.sha }}
          path: |
            packages/happy-ios/build/ci/HappyUIKitHostedTests.xcresult
            packages/happy-ios/build/ci/simulators.json
            packages/happy-ios/build/ci/hosted-shard.txt
            packages/happy-ios/build/ci/hosted-build.log
            packages/happy-ios/build/ci/hosted-link-check.log
            packages/happy-ios/build/ci/hosted-xcodebuild.log
            packages/happy-ios/build/ci/hosted-test-summary.json
            packages/happy-ios/build/ci/hosted-test-results.json
            packages/happy-ios/build/ci/hosted-diagnostics
            packages/happy-ios/build/ci/hosted-diagnostics-export.log
          if-no-files-found: warn
          retention-days: 7
