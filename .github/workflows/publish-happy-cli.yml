name: Publish @namsangboy/happy-cli

# Triggered by a tag of the form `happy-cli-v<semver>`. The tag's version
# (after the prefix) MUST match packages/happy-cli/package.json's version
# or the job fails before publishing — prevents accidental version drift.
#
# First-time setup (one time only):
#   1. `npm login` locally as namsangboy, then `npm token create --read-only`
#      or `--publish` and copy the token.
#   2. In GitHub repo Settings → Secrets and variables → Actions → New
#      repository secret: NPM_TOKEN = <the token from step 1>.
#   3. Bump version in packages/happy-cli/package.json.
#   4. `git tag happy-cli-v1.1.4-aplus.0 && git push origin happy-cli-v1.1.4-aplus.0`.

on:
    push:
        tags:
            - 'happy-cli-v*'

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write  # enables npm provenance
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.11.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install monorepo dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify tag matches package version
              run: |
                  VERSION=$(node -p "require('./packages/happy-cli/package.json').version")
                  TAG="${GITHUB_REF#refs/tags/happy-cli-v}"
                  if [ "$VERSION" != "$TAG" ]; then
                      echo "::error::tag/version mismatch — tag=$TAG package.json=$VERSION"
                      exit 1
                  fi
                  echo "OK — publishing $VERSION from tag happy-cli-v$TAG"

            - name: Build happy-cli
              run: pnpm --filter @namsangboy/happy-cli build

            - name: Prepare publish artifact
              run: node packages/happy-cli/scripts/prepare-publish-package.cjs --out "$RUNNER_TEMP/happy-cli-publish"

            - name: Pack publish artifact
              id: pack_publish_artifact
              working-directory: ${{ runner.temp }}/happy-cli-publish
              run: |
                  mkdir -p "$RUNNER_TEMP/happy-cli-pack"
                  npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/happy-cli-pack"
                  TARBALL="$(ls "$RUNNER_TEMP"/happy-cli-pack/*.tgz)"
                  echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

            - name: Guard publish artifact
              run: node packages/happy-cli/scripts/guard-publish-artifact.cjs "${{ steps.pack_publish_artifact.outputs.tarball }}" --install-smoke

            - name: Publish to npm
              # Publish the exact tarball that passed the guard, not a directory path.
              # The guard above fails if workspace/file dependencies leak into npm metadata.
              run: npm publish "${{ steps.pack_publish_artifact.outputs.tarball }}" --access public --tag latest --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'
