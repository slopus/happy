name: Publish @buzzni/happy-cli

# Triggered by a tag of the form `happy-cli-v<semver>`. The tag's version
# (after the prefix) MUST match packages/happy-cli/package.json's version
# or the job fails before publishing — prevents accidental version drift.
#
# First-time setup (one time only):
#   1. Create an npm automation token that can publish public packages in the
#      `@buzzni` organization scope.
#   2. In GitHub repo Settings → Secrets and variables → Actions → New
#      repository secret: NPM_TOKEN = <the token from step 1>.
#   3. Bump version in packages/happy-cli/package.json.
#   4. `git tag happy-cli-v1.1.4-aplus.0 && git push origin happy-cli-v1.1.4-aplus.0`.
#   5. Agent Browser images (Saydo specs/agent-browser-one-click-install): repository
#      secret DOCKER_PAT = a Docker Hub access token of the `namsangboy` account
#      with write access to namsangboy/abp-runtime and namsangboy/abp-browser.
#      Without it the CLI is still published, but without abp-images.json, so
#      machines of that release cannot use the one-line install.

on:
    push:
        tags:
            - 'happy-cli-v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Already published exact A+ CLI version to verify (no publication)'
                required: true
                type: string

permissions:
    contents: read

jobs:
    publish:
        if: github.event_name == 'push'
        runs-on: ubuntu-latest
        # The arm64 browser image builds under QEMU emulation (Chromium apt install), which takes a while.
        timeout-minutes: 75
        permissions:
            contents: read
            id-token: write  # enables npm provenance
        outputs:
            version: ${{ steps.release_version.outputs.version }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.11.0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install monorepo dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify tag matches package version
              id: release_version
              run: |
                  VERSION=$(node -p "require('./packages/happy-cli/package.json').version")
                  TAG="${GITHUB_REF#refs/tags/happy-cli-v}"
                  if [ "$VERSION" != "$TAG" ]; then
                      echo "::error::tag/version mismatch — tag=$TAG package.json=$VERSION"
                      exit 1
                  fi
                  echo "OK — publishing $VERSION from tag happy-cli-v$TAG"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Build happy-cli
              run: |
                  PACKAGE_NAME="$(node -p "require('./packages/happy-cli/package.json').name")"
                  pnpm --filter "$PACKAGE_NAME" build

            - name: Check Agent Browser image credentials
              id: abp_images
              env:
                  DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
              run: |
                  if [ -z "$DOCKER_PAT" ]; then
                      echo "::warning::DOCKER_PAT is not configured: publishing without Agent Browser images (no abp-images.json, the one-line install will refuse this release)."
                      echo "enabled=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "enabled=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Set up QEMU
              if: steps.abp_images.outputs.enabled == 'true'
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              if: steps.abp_images.outputs.enabled == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              if: steps.abp_images.outputs.enabled == 'true'
              uses: docker/login-action@v3
              with:
                  username: namsangboy
                  password: ${{ secrets.DOCKER_PAT }}

            - name: Publish Agent Browser images (linux/amd64, linux/arm64)
              if: steps.abp_images.outputs.enabled == 'true'
              # Writes scripts/agent-browser/abp-images.json into the package: the digests abp-stack pull checks.
              run: node packages/happy-cli/scripts/agent-browser/publish-images.mjs --repo namsangboy --version "${{ steps.release_version.outputs.version }}" --out packages/happy-cli/scripts/agent-browser/abp-images.json

            - name: Prepare publish artifact
              run: node packages/happy-cli/scripts/prepare-publish-package.cjs --out "$RUNNER_TEMP/happy-cli-publish"

            - name: Pack publish artifact
              id: pack_publish_artifact
              working-directory: ${{ runner.temp }}/happy-cli-publish
              run: |
                  mkdir -p "$RUNNER_TEMP/happy-cli-pack"
                  npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/happy-cli-pack"
                  TARBALL="$(ls "$RUNNER_TEMP"/happy-cli-pack/*.tgz)"
                  echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

            - name: Guard publish artifact
              run: node packages/happy-cli/scripts/guard-publish-artifact.cjs "${{ steps.pack_publish_artifact.outputs.tarball }}" --install-smoke

            - name: Publish to npm
              # Publish the exact tarball the guard verified. Anything that
              # re-packs at publish time (directory-path publish, publishing
              # from inside the directory with a different npm, or pnpm/yarn
              # publish — which do not implement bundledDependencies at all)
              # can drop the bundled node_modules while the metadata still
              # declares them; fresh installs then die with
              # ERR_MODULE_NOT_FOUND. This shipped as 1.1.10-aplus.36 and
              # 1.1.10-aplus.44.
              run: npm publish "${{ steps.pack_publish_artifact.outputs.tarball }}" --access public --tag latest --ignore-scripts
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  NPM_CONFIG_PROVENANCE: 'true'

    verify:
        needs: publish
        if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
        runs-on: ubuntu-latest
        timeout-minutes: 45
        env:
            RELEASE_VERSION: ${{ inputs.version || needs.publish.outputs.version }}
        steps:
            - name: Checkout verifier
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Validate existing release tag
              run: |
                  if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-aplus\.[0-9]+$ ]]; then
                      echo 'Expected an exact A+ CLI release version' >&2
                      exit 1
                  fi
                  git fetch --no-tags origin "refs/tags/happy-cli-v$RELEASE_VERSION"
                  TAG_VERSION="$(git show FETCH_HEAD:packages/happy-cli/package.json | node -e 'let text="";process.stdin.on("data",chunk=>text+=chunk);process.stdin.on("end",()=>console.log(JSON.parse(text).version))')"
                  test "$TAG_VERSION" = "$RELEASE_VERSION"

            - name: Guard registry package and fresh install
              run: bash packages/happy-cli/scripts/verify-published-package.sh "$RELEASE_VERSION"
