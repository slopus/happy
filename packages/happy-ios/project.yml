# XcodeGen spec for the Xcode project. Generate with `xcodegen` in this
# directory; the .xcodeproj is not committed.
#
# Independent UIKit iOS and AppKit macOS targets, three configurations:
#   Debug   -> com.slopus.happy.dev      "Happy (dev)"
#   Preview -> com.slopus.happy.preview  "Happy (preview)"
#   Release -> com.ex3ndr.happy          "Happy"
# The app target compiles Sources/HappyApp itself and links the package's
# HappyKit product, which holds everything else.
name: Happy
options:
  bundleIdPrefix: com.slopus
  deploymentTarget:
    iOS: "26.0"
    macOS: "14.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Preview: release
  Release: release
# HAPPY_CALL_AGENT_V3_ID and HAPPY_REVENUE_CAT_APPLE_KEY, from an ignored
# Config/Call.local.xcconfig or the environment.
configFiles:
  Debug: Config/Call.xcconfig
  Preview: Config/Call.xcconfig
  Release: Config/Call.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2026.11.1"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
packages:
  HappyIOS:
    path: .
targets:
  Happy:
    type: application
    platform: iOS
    sources:
      - path: Sources/HappyApp
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: HappyIOS
        product: HappyKit
      - package: HappyIOS
        product: HappyGuestKit
    # A store build without the voice agent ships a voice button that only
    # says voice isn't set up: Preview and Release need HAPPY_CALL_AGENT_V3_ID
    # (an ElevenLabs agent ID, as CallAgent.id reads it). Checked in the built
    # Info.plist, what the app reads, whichever way the setting came. A build
    # that ships nowhere says so with HAPPY_RELEASE_WITHOUT_CALL_AGENT=1.
    # Debug never needs it.
    postBuildScripts:
      - name: Require the voice agent
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          case "$CONFIGURATION" in Preview|Release) ;; *) exit 0 ;; esac
          id=$(/usr/libexec/PlistBuddy -c "Print :HappyCallAgentID" "$SCRIPT_INPUT_FILE_0" 2>/dev/null || true)
          if printf '%s' "$id" | grep -Eqx 'agent_[A-Za-z0-9_]+'; then exit 0; fi
          if [ "${HAPPY_RELEASE_WITHOUT_CALL_AGENT:-}" = 1 ]; then
            echo "warning: HAPPY_RELEASE_WITHOUT_CALL_AGENT=1: this $CONFIGURATION build has no voice agent; voice says it isn't set up."
            exit 0
          fi
          if [ -z "$id" ]; then
            echo "error: A $CONFIGURATION build needs the voice agent: set HAPPY_CALL_AGENT_V3_ID (Config/Call.local.xcconfig, the xcodebuild command line or the environment) to the v3 agent's ID. The old HAPPY_CALL_AGENT_ID is ignored. See docs/agent-voice-call.md"
          else
            echo "error: A $CONFIGURATION build needs the voice agent, and HAPPY_CALL_AGENT_V3_ID isn't an ElevenLabs agent ID (agent_…)."
          fi
          exit 1
    settings:
      base:
        PRODUCT_NAME: Happy
        # Xcode adds the bundle keys (identifier, executable, ...) to the
        # variant's Info.plist below.
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Every variant has aps-environment "development", as the RN app's
        # expo-notifications plugin writes it; signing for distribution
        # replaces it with the profile's "production". Every variant opens
        # Happy Cloud's invite links (join.happy.engineering); production
        # also has app.happy.engineering.
        #
        # HAPPY_GOOGLE_CLIENT is the variant's own iOS OAuth client for
        # Continue with Google (public, not a secret): the Info.plists make
        # GIDClientID and its reversed URL scheme from it.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.dev
          INFOPLIST_FILE: App/Info-Development.plist
          CODE_SIGN_ENTITLEMENTS: App/Happy.entitlements
          HAPPY_GOOGLE_CLIENT: 902947412706-3563t62iimaknc7lq6fdhgcgna7eff1l
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.preview
          INFOPLIST_FILE: App/Info-Preview.plist
          CODE_SIGN_ENTITLEMENTS: App/Happy.entitlements
          HAPPY_GOOGLE_CLIENT: 902947412706-0s9bb1000luv6d9vkdbau31h2i69gad0
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.ex3ndr.happy
          INFOPLIST_FILE: App/Info-Production.plist
          CODE_SIGN_ENTITLEMENTS: App/Happy-Production.entitlements
          HAPPY_GOOGLE_CLIENT: 902947412706-3a9fl74rsj3566r0a9i2310mgeu1qd09
          CURRENT_PROJECT_VERSION: "160"
  HappyMac:
    # Genuine AppKit/macOS SDK target. No UIKit, Catalyst or iPad binary.
    type: application
    platform: macOS
    sources:
      - path: Sources/HappyMacApp
      - path: Mac/Assets.xcassets
    dependencies:
      - package: HappyIOS
        product: HappyClientKit
    settings:
      base:
        PRODUCT_NAME: HappyMac
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Mac/Info.plist
        CODE_SIGN_ENTITLEMENTS: Mac/HappyMac.entitlements
        CODE_SIGN_STYLE: Automatic
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.native.mac.dev
          INFOPLIST_KEY_CFBundleDisplayName: Happy Native (dev)
          HAPPY_APP_VARIANT: development
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.native.mac.preview
          INFOPLIST_KEY_CFBundleDisplayName: Happy Native (preview)
          HAPPY_APP_VARIANT: preview
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.native.mac
          INFOPLIST_KEY_CFBundleDisplayName: Happy Native
          HAPPY_APP_VARIANT: production
  HappyMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/HappyMacTests
      - path: Tests/HappyCoreTests/MacAppConfigurationTests.swift
      - path: Tests/HappyCoreTests/AppConfigurationTests.swift
      - path: Tests/HappyCoreTests/NativePresentationTests.swift
      - path: Tests/HappyCoreTests/NativeAccountFactoryTests.swift
      - path: Tests/HappyLayoutTests/MacDesktopLayoutTests.swift
    dependencies:
      - target: HappyMac
      - package: HappyIOS
        product: HappyClientKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.native.mac.tests
        SDKROOT: macosx
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HappyMac.app/Contents/MacOS/HappyMac"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HappyUIKitTests:
    # Measures real UIKit views; needs an iOS simulator. Not hosted in the
    # app: the views under test need no running application.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HappyUIKitTests
    dependencies:
      - package: HappyIOS
        product: HappyKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.uikit-tests
  HappyUIKitTestHost:
    type: application
    platform: iOS
    sources:
      - path: TestHost
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: HappyUIKitTestHost
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.uikit-testhost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TestHost/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_DEBUG_DYLIB: NO
  HappyUIKitHostedTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HappyUIKitHostedTests
      # The time scale both UIKit bundles read.
      - path: Tests/HappyUIKitTests/TestTime.swift
    dependencies:
      - target: HappyUIKitTestHost
      - package: HappyIOS
        product: HappyKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.hosted-uikit-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HappyUIKitTestHost.app/HappyUIKitTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HappyChatHarness:
    # One fixture chat, offline, under the app's own root, for the UI tests
    # that drive it with a finger (Harness/ChatHarness.swift). Debug only.
    type: application
    platform: iOS
    sources:
      - path: Harness
        excludes:
          - Info.plist
    dependencies:
      - package: HappyIOS
        product: HappyKit
    settings:
      base:
        PRODUCT_NAME: HappyChatHarness
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.chat-harness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Harness/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_DEBUG_DYLIB: NO
  HappyChatUITests:
    # Gestures UIKit can only take from another process: an interactive
    # keyboard dismiss, a long press and drag on the scroll indicator.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HappyChatUITests
    dependencies:
      - target: HappyChatHarness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.chat-ui-tests
        TEST_TARGET_NAME: HappyChatHarness
  HappyDirectUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/HappyDirectUITests
    dependencies:
      - target: Happy
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.direct-ui-tests
        TEST_TARGET_NAME: Happy
schemes:
  Happy Mac:
    build:
      targets:
        HappyMac: all
        HappyMacTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HappyMacTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Happy Mac (preview):
    build:
      targets:
        HappyMac: all
    run:
      config: Preview
    profile:
      config: Preview
    analyze:
      config: Preview
    archive:
      config: Preview
  HappyDirectUI:
    build:
      targets:
        Happy: [test]
        HappyDirectUITests: [test]
    test:
      config: Debug
      targets:
        - HappyDirectUITests
  HappyChatUI:
    build:
      targets:
        HappyChatHarness: [test]
        HappyChatUITests: [test]
    test:
      config: Debug
      targets:
        - HappyChatUITests
  HappyUIKitHosted:
    build:
      targets:
        HappyUIKitTestHost: [test]
        HappyUIKitHostedTests: [test]
    test:
      config: Debug
      targets:
        - HappyUIKitHostedTests
  Happy:
    build:
      targets:
        Happy: all
        HappyUIKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HappyUIKitTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  Happy (preview):
    build:
      targets:
        Happy: all
    run:
      config: Preview
    profile:
      config: Preview
    analyze:
      config: Preview
    archive:
      config: Preview
