# Isolated device-validation host. Never replaces an installed Happy variant.
name: HappyBotDevelopment
options:
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Preview: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "2026.10.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 466DQWDR8C
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_DEBUG_DYLIB: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    OTHER_SWIFT_FLAGS: "$(inherited) -D HAPPY_GUEST_STANDALONE"
targets:
  HappyBotDevelopment:
    type: application
    platform: iOS
    sources: &guestSources
      - Sources
      - ../Sources/HappyGuest
      - ../Sources/HappyGuestUI
      - ../Sources/HappyLayout/Guest
      - ../App/Assets.xcassets
    dependencies:
      - target: HappyBotClip
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botclip.dev
        INFOPLIST_FILE: Host-Info.plist
        CODE_SIGN_ENTITLEMENTS: Host.entitlements
  HappyBotClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources: *guestSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botclip.dev.Clip
        HAPPY_PARENT_BUNDLE_ID: com.slopus.happy.botclip.dev
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Clip.entitlements
      configs:
        Debug:
          INFOPLIST_FILE: Info-Debug.plist
        Preview:
          INFOPLIST_FILE: Info-Preview.plist
  HappyGuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../Sources/HappyGuest
      - ../Sources/HappyLayout/Guest
      - ../Tests/HappyGuestTests
      - ../Tests/HappyLayoutTests/GuestChatLayoutTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botclip.tests
  HappyBotGuestHarness:
    # Normal app for testing the shared screen while Clip profiles are absent.
    # A launch of this target is never evidence of an actual App Clip launch.
    type: application
    platform: iOS
    sources: *guestSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botguest.harness
        INFOPLIST_FILE: Host-Info.plist
  HappyBotGuestUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: HappyBotGuestHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botguest.ui-tests
        TEST_TARGET_NAME: HappyBotGuestHarness
  HappyBotClipLiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: LiveTests
    dependencies:
      - target: HappyBotGuestHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botclip.live-tests
        TEST_TARGET_NAME: HappyBotGuestHarness
  HappyBotClipReadOnlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: ReadOnlyTests
    dependencies:
      - target: HappyBotGuestHarness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.slopus.happy.botclip.readonly-tests
        TEST_TARGET_NAME: HappyBotGuestHarness
schemes:
  HappyBotClip:
    build:
      targets:
        HappyBotDevelopment: all
        HappyBotClip: all
    run:
      executable: HappyBotClip
      environmentVariables:
        _XCAppClipURL: https://app.happy.engineering/bot/invite/development-invitation
    test:
      targets:
        - HappyGuestTests
  HappyBotGuestUI:
    build:
      targets:
        HappyBotGuestHarness: [test]
        HappyBotGuestUITests: [test]
    test:
      targets:
        - HappyBotGuestUITests
  HappyBotClipLive:
    build:
      targets:
        HappyBotGuestHarness: [test]
        HappyBotClipLiveUITests: [test]
    test:
      targets:
        - HappyBotClipLiveUITests
  HappyBotClipReadOnly:
    build:
      targets:
        HappyBotGuestHarness: [test]
        HappyBotClipReadOnlyUITests: [test]
    test:
      targets:
        - HappyBotClipReadOnlyUITests