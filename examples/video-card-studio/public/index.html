<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>原话卡片</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <header class="site-header"><a class="brand" href="/">原话卡片</a></header>
    <main>
      <section class="intro" aria-labelledby="intro-title">
        <h1 id="intro-title">把 B 站视频做成原话卡片</h1>
        <p class="lede">从原视频选取画面和对白，制作可下载的长图。</p>
        <form id="submit-form">
          <label for="video-url">B 站视频链接</label>
          <div class="input-row">
            <input id="video-url" name="url" type="text" inputmode="url" autocomplete="off" required maxlength="2048" placeholder="https://www.bilibili.com/video/BV…">
            <button id="submit-button" type="submit">制作卡片</button>
          </div>
          <p id="form-feedback" class="feedback" role="status" aria-live="polite"></p>
        </form>
        <p class="public-note">支持 60 分钟以内的公开单 P 视频。提交记录与卡片会公开展示。</p>
      </section>

      <section class="task-section" aria-labelledby="task-title">
        <div class="section-heading">
          <h2 id="task-title">制作进度 <span id="queue-count" hidden></span></h2>
          <div class="connection">
            <span id="connection-label">正在连接</span>
            <button id="reconnect" class="quiet" type="button" hidden>重新连接</button>
          </div>
        </div>
        <div id="queue" class="task-list"><p class="muted">正在读取制作记录…</p></div>
        <details id="history" class="history" hidden>
          <summary id="history-label">历史任务</summary>
          <div id="history-list"></div>
        </details>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="section-heading"><h2 id="gallery-title">已完成作品</h2></div>
        <div id="gallery"><p class="empty">卡片制作完成后会显示在这里。</p></div>
      </section>
    </main>
    <footer><p>卡片文字来自自动转写。每张图保留原视频和时间点，便于核对。</p></footer>
  </div>
</body>
</html>
