<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paws · 单条工具调用折叠验收</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1014;
      --panel: #161c22;
      --line: rgba(255, 255, 255, 0.11);
      --text: #f5f7f8;
      --muted: #aab3bb;
      --accent: #65d6c7;
      --success: #79dc96;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 14% -8%, rgba(101, 214, 199, 0.22), transparent 34rem),
        radial-gradient(circle at 100% 12%, rgba(121, 220, 150, 0.12), transparent 30rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1540px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0 80px; }
    header { max-width: 900px; margin-bottom: 36px; }
    .eyebrow { color: var(--accent); font-size: 13px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0 16px; font-size: clamp(38px, 6vw, 72px); line-height: .98; letter-spacing: -.045em; }
    .intro { margin: 0; color: var(--muted); font-size: clamp(16px, 2vw, 20px); line-height: 1.7; }
    .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .chip { padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.04); color: #dbe2e6; font-size: 13px; }
    .chip.success { color: var(--success); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    article { overflow: hidden; border: 1px solid var(--line); border-radius: 22px; background: rgba(22,28,34,.92); box-shadow: 0 30px 70px rgba(0,0,0,.3); }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
    .label { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; }
    .number { display: grid; width: 28px; height: 28px; place-items: center; border-radius: 8px; background: rgba(101,214,199,.14); color: #9aeadf; font-size: 12px; }
    .note { color: var(--muted); font-size: 12px; }
    .shot { display: grid; min-height: 500px; place-items: center; padding: 16px; background: #090c0f; }
    img { display: block; width: 100%; height: auto; max-height: 680px; object-fit: contain; border-radius: 12px; }
    footer { display: flex; justify-content: space-between; gap: 24px; margin-top: 24px; color: var(--muted); font-size: 13px; line-height: 1.6; }
    code { color: #9aeadf; }
    @media (max-width: 920px) {
      main { padding-top: 40px; }
      .grid { grid-template-columns: 1fr; }
      .shot { min-height: auto; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">STANDALONE-TOOL-01 · UI evidence</div>
      <h1>单独一条工具调用，也回到紧凑折叠行。</h1>
      <p class="intro">修复复用了现有工具分组逻辑：Skill 状态条之后的单条 Bash 不再撑成独立终端行，收起时与活动行保持同一视觉节奏，完整工具消息仍被保留。</p>
      <div class="summary">
        <span class="chip success">✓ 同一真实消息链路</span>
        <span class="chip success">✓ 1100×820 / DPR 1</span>
        <span class="chip success">✓ E2E 已通过</span>
        <span class="chip">Visible UI cases: 1</span>
      </div>
    </header>
    <section class="grid" aria-label="单条工具调用修复前后对比">
      <article>
        <div class="card-head">
          <div class="label"><span class="number">01</span>修复前</div>
          <div class="note">独立终端行展示完整命令</div>
        </div>
        <div class="shot"><img src="case-1-before.png" alt="修复前，单条 Bash 作为独立终端行显示"></div>
      </article>
      <article>
        <div class="card-head">
          <div class="label"><span class="number">02</span>修复后</div>
          <div class="note">复用紧凑工具组折叠头</div>
        </div>
        <div class="shot"><img src="case-1-after.png" alt="修复后，单条 Bash 显示为紧凑折叠行"></div>
      </article>
    </section>
    <footer>
      <span>Case：<code>[STANDALONE-TOOL]</code></span>
      <span>相同 fixture · 相同视口 · 相同主题 · 相同裁剪</span>
    </footer>
  </main>
</body>
</html>
